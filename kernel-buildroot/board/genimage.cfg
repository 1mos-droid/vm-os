image hyperos.img {
    hdimage {
        disk-signature = 0x48595045
    }
    partition boot {
        in-partition-table = "no"
        image = "boot.img"
        offset = 0
        size = 512
        holes = {"(440; 512)"}
    }
    partition grub {
        in-partition-table = "no"
        image = "grub.img"
        offset = 512
    }
    partition root {
        partition-type = 0x83
        image = "rootfs.ext2"
        offset = 1M
        bootable = "true"
    }
    partition data {
        partition-type = 0x83
        image = "data.btrfs"
    }
}
