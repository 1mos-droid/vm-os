image efi-part.vfat {
    vfat {
        label = "HYPEROS_EFI"
        extraargs = "-F 32"
        file EFI/BOOT/BOOTX64.EFI {
            image = "efi-part/EFI/BOOT/BOOTX64.EFI"
        }
        file EFI/BOOT/grub.cfg {
            image = "efi-part/EFI/BOOT/grub.cfg"
        }
        file boot/grub/grub.cfg {
            image = "efi-part/boot/grub/grub.cfg"
        }
        file boot/bzImage {
            image = "bzImage"
        }
        file boot/initramfs.cpio.zst {
            image = "initramfs.cpio.zst"
        }
    }
    size = 100M
}

image hyperos.img {
    hdimage {
        partition-table-type = "hybrid"
        align = 1M
        fill = true
        disk-signature = 0x48595045
        disk-uuid = "48595045-0000-4000-8000-000000000000"
    }
    partition boot {
        in-partition-table = "no"
        image = "boot-hybrid.img"
        offset = 0
        size = 512
        holes = {"(440; 512)"}
    }
    partition bios-boot {
        in-partition-table = "no"
        image = "grub-hybrid.img"
        offset = 1M
    }
    partition efi {
        partition-type = 0xef
        partition-type-uuid = U
        partition-uuid = "48595045-0000-4000-8000-000000000001"
        offset = 2M
        size = 100M
        bootable = "true"
        image = "efi-part.vfat"
    }
    partition root {
        partition-type = 0x83
        partition-type-uuid = L
        partition-uuid = "48595045-0000-4000-8000-000000000002"
        size = 512M
        image = "rootfs.erofs"
    }
    partition data {
        partition-type = 0x83
        partition-type-uuid = L
        partition-uuid = "48595045-0000-4000-8000-000000000003"
        size = 512M
        image = "data.btrfs"
    }
}
