set default=0
set timeout=3

if serial --unit=0 --speed=115200; then
    terminal_input console serial
    terminal_output console serial
fi

search --no-floppy --label --set=root HYPEROS_EFI

menuentry "HyperOS - Persistent Mode" {
    linux /boot/bzImage hyperos.mode=persistent hyperos.root_partuuid=48595045-0000-4000-8000-000000000002 hyperos.data_label=HYPEROS_DATA rootwait console=tty0 console=ttyS0,115200
    initrd /boot/initramfs.cpio.zst
}

menuentry "HyperOS - Stateless RAM-Only Mode" {
    linux /boot/bzImage hyperos.mode=stateless hyperos.root_partuuid=48595045-0000-4000-8000-000000000002 hyperos.data_label=HYPEROS_DATA rootwait console=tty0 console=ttyS0,115200
    initrd /boot/initramfs.cpio.zst
}
