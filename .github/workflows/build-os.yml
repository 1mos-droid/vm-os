name: Build HyperOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyperos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source configuration
        run: scripts/validate-configs.sh

  build:
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILDROOT_VERSION: 2025.02.1
      # Buildroot 2025.02 host tools predate the compiler defaulting to C23.
      HOSTCC: ${{ github.workspace }}/scripts/host-gcc-gnu17
      # Use Buildroot's pinned CMake; CMake 4 rejects older bundled projects.
      BR2_CMAKE_CANDIDATES: ""
      BR2_DL_DIR: ${{ github.workspace }}/dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/.buildroot-ccache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (musl target for vmm-daemon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio rsync file wget unzip python3 libncurses-dev libssl-dev
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('kernel-buildroot/configs/**', 'kernel-buildroot/kernel/**', 'kernel-buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-
      - name: Cache Buildroot ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_CCACHE_DIR }}
          key: buildroot-ccache-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('kernel-buildroot/configs/**', 'kernel-buildroot/kernel/**') }}-${{ github.run_id }}
          restore-keys: |
            buildroot-ccache-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('kernel-buildroot/configs/**', 'kernel-buildroot/kernel/**') }}-
            buildroot-ccache-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-
      - name: Cache Rust cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-musl-${{ hashFiles('vmm-daemon/Cargo.lock', 'vmm-daemon/Cargo.toml', 'vmm-daemon/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-musl-${{ hashFiles('vmm-daemon/Cargo.lock') }}-
            cargo-${{ runner.os }}-musl-
      - name: Fetch pinned Buildroot
        run: |
          curl --fail --location --retry 3 "https://buildroot.org/downloads/buildroot-${BUILDROOT_VERSION}.tar.xz" -o buildroot.tar.xz
          echo 'a3216907e7ce1bbd38413e20b0861641b160ecc40dd7b598febb7f12984b3206  buildroot.tar.xz' | sha256sum -c -
          mkdir buildroot
          tar -xf buildroot.tar.xz -C buildroot --strip-components=1
      - name: Resolve and validate Buildroot configuration
        run: |
          make -C buildroot O="$GITHUB_WORKSPACE/output" BR2_EXTERNAL="$GITHUB_WORKSPACE/kernel-buildroot" hyperos_x86_64_defconfig
          scripts/validate-configs.sh --resolved-buildroot output/.config
      - name: Build kernel and hybrid bootable image
        run: |
          mkdir -p "$BR2_CCACHE_DIR" "$CARGO_TARGET_DIR"
          make -C buildroot O="$GITHUB_WORKSPACE/output" \
            CARGO_HOME="$HOME/.cargo" \
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            -j2
      - name: Validate resolved kernel, target binaries, and hybrid image outputs
        run: |
          scripts/validate-configs.sh --resolved-kernel output/build/linux-6.12.20/.config
          scripts/validate-configs.sh --image output/images/hyperos.img
          test -s output/images/hyperos.img
          test -s output/images/bzImage
          test -s output/images/rootfs.erofs
          test -s output/images/initramfs.cpio.zst
          test -s output/images/efi-part.vfat
          test -s output/images/efi-part/EFI/BOOT/BOOTX64.EFI
          test -s output/target/boot/bzImage
          test -x output/target/sbin/runit
          test -x output/target/usr/bin/vmm-daemon
          test -x output/target/usr/sbin/nft || test -x output/target/sbin/nft
          test -x output/target/sbin/ip || test -x output/target/usr/sbin/ip
          test "$(readlink output/target/sbin/init)" = runit
          test "$(readlink output/target/bin/sh)" = dash
      - name: Smoke-test packaged target vmm-daemon (list_vms over AF_UNIX)
        run: |
          python3 - <<'PY'
          import json, os, signal, socket, subprocess, tempfile, time
          from pathlib import Path

          with tempfile.TemporaryDirectory() as td:
              sock_path = Path(td) / 'vmm.sock'
              storage_dir = Path(td) / 'storage'
              proc = subprocess.Popen([
                  'output/target/usr/bin/vmm-daemon',
                  '--dry-run',
                  '--socket', str(sock_path),
                  '--storage-dir', str(storage_dir),
              ])
              try:
                  connected = False
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  for _ in range(40):
                      try:
                          s.connect(str(sock_path))
                          connected = True
                          break
                      except OSError:
                          time.sleep(0.05)
                  assert connected, 'packaged vmm-daemon failed to bind Unix socket'
                  s.sendall(b'{"jsonrpc":"2.0","id":"ci-list-1","method":"list_vms","params":{}}\n')
                  resp = b''
                  while not resp.endswith(b'\n'):
                      chunk = s.recv(4096)
                      assert chunk, 'EOF before JSON-RPC response'
                      resp += chunk
                  s.close()
                  payload = json.loads(resp.decode('utf-8'))
                  assert payload == {'jsonrpc': '2.0', 'id': 'ci-list-1', 'result': {'vms': []}}, payload
                  print('PASS: packaged musl /usr/bin/vmm-daemon answered list_vms:', payload)
              finally:
                  proc.send_signal(signal.SIGTERM)
                  assert proc.wait(timeout=5) == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyperos-x86_64-hybrid-${{ github.sha }}
          if-no-files-found: error
          compression-level: 1
          path: |
            output/images/hyperos.img
            output/images/bzImage
            output/images/rootfs.erofs
            output/images/initramfs.cpio.zst
            output/images/efi-part/EFI/BOOT/BOOTX64.EFI
            output/target/usr/bin/vmm-daemon
            output/.config
            output/build/linux-6.12.20/.config
