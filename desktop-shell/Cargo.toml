[package]
name = "desktop-shell"
version = "0.1.0"
edition = "2021"
description = "Original Workspace-First Wayland desktop shell for HyperOS built with Smithay and Slint"
license = "MIT OR Apache-2.0"

[features]
default = []
# Enable bare-metal DRM/KMS/libinput/seatd backend when building inside HyperOS Buildroot.
kms = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_udev",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_pixman",
    "renderer_glow",
    "backend_winit",
] }
uuid = { version = "1.11", features = ["v4"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
