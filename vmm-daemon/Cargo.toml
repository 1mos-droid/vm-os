[package]
name = "vmm-daemon"
version = "0.1.0"
edition = "2021"
description = "Privileged HyperOS VMM control-plane daemon supervising crosvm over JSON-RPC 2.0"
license = "MIT OR Apache-2.0"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
