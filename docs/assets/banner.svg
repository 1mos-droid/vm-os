<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">HyperOS</title>
  <desc id="d">HyperOS: a lab OS for disposable, isolated VMs on 4 GB of RAM</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- Logo: a host hexagon holding three isolated VM cells -->
  <g transform="translate(250 200)">
    <polygon points="0,-132 114,-66 114,66 0,132 -114,66 -114,-66" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <polygon points="0,-108 94,-54 94,54 0,108 -94,54 -94,-54" fill="#22d3ee" fill-opacity="0.05"/>
    <rect x="-62" y="-62" width="52" height="52" rx="10" fill="#22d3ee"/>
    <rect x="10" y="-62" width="52" height="52" rx="10" fill="#a78bfa"/>
    <rect x="-62" y="10" width="52" height="52" rx="10" fill="#a78bfa" fill-opacity="0.85"/>
    <rect x="10" y="10" width="52" height="52" rx="10" fill="none" stroke="#f472b6" stroke-width="4" stroke-dasharray="8 6"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="440" y="178" font-size="96" font-weight="800" fill="#f8fafc" letter-spacing="-2">Hyper<tspan fill="url(#accent)">OS</tspan></text>
    <text x="444" y="230" font-size="30" font-weight="500" fill="#cbd5e1">A malware &amp; research lab OS built for 4 GB machines.</text>

    <g font-size="20" font-weight="600">
      <rect x="444" y="268" width="196" height="44" rx="22" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="542" y="297" fill="#67e8f9" text-anchor="middle">Disposable VMs</text>
      <rect x="656" y="268" width="196" height="44" rx="22" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="754" y="297" fill="#c4b5fd" text-anchor="middle">Snapshot rollback</text>
      <rect x="868" y="268" width="180" height="44" rx="22" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="958" y="297" fill="#f9a8d4" text-anchor="middle">Packet capture</text>
      <rect x="1064" y="268" width="152" height="44" rx="22" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="1140" y="297" fill="#6ee7b7" text-anchor="middle">LAN-blocked</text>
    </g>
  </g>
</svg>
